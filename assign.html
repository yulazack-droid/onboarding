<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assign Journey | LGP Onboarding Hub</title><link rel="stylesheet" href="template.css?v=2.1.0"></head>
<body><main id="gate" class="shell"><section class="card"><p class="eyebrow">LGP Onboarding Hub</p><h1>Sign in to assign a Journey</h1><button id="signIn" class="button">Sign in with Google</button><p id="message"></p></section></main>
<main id="app" class="shell" hidden><a id="back" class="back" href="hub.html">← Back to template</a><section class="assign-layout"><section class="hero"><p class="eyebrow">Assign Journey</p><h1 id="templateName">Loading template…</h1><p id="templateDescription"></p><p class="assign-note">This creates a new, independent Journey. It will not change the role template or Mary’s existing Journey.</p></section><form id="assignForm" class="assign-form"><label>Employee name<input name="employeeName" autocomplete="name" required></label><label>Employee email<input name="employeeEmail" type="email" required></label><label>Manager name<input name="managerName" autocomplete="name" required></label><label>Manager email<input name="managerEmail" type="email" required></label><label>Start date<input name="startDate" type="date" required></label><p id="status" role="status"></p><button id="submit" class="button" type="submit">Create and open Journey</button></form></section></main><script type="module" src="assign.js?v=1.0.0"></script></body></html>
