<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assign Journey | LGP Onboarding Hub</title><link rel="stylesheet" href="template.css?v=2.1.0"></head>
<body><main id="gate" class="shell"><section class="card"><p class="eyebrow">LGP Onboarding Hub</p><h1>Sign in to assign a Journey</h1><button id="signIn" class="button">Sign in with Google</button><p id="message"></p></section></main>
<main id="app" class="shell" hidden><a id="back" class="back" href="hub.html">← Back to template</a><section class="assign-layout"><section class="hero"><p id="mode" class="eyebrow">Assign Journey</p><h1 id="templateName">Loading template…</h1><p id="templateDescription"></p><p class="assign-note">A draft saves setup work without creating a Production Journey. Submit creates the Production Journey and will not change the role template or Mary’s existing Journey.</p></section><form id="assignForm" class="assign-form"><label>Employee name<input name="employeeName" autocomplete="name"></label><label>Employee email<input name="employeeEmail" type="email"></label><label>Manager name<input name="managerName" autocomplete="name"></label><label>Manager email<input name="managerEmail" type="email"></label><label>Start date<input name="startDate" type="date"></label><p id="status" role="status"></p><div class="form-actions"><button id="saveDraft" class="button secondary-button" type="button">Save draft</button><button id="submit" class="button" type="submit">Submit and create Production Journey</button></div></form></section></main><script type="module" src="assign.js?v=1.1.0"></script></body></html>
